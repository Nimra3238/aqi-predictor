name: Daily Model Training Loop

on:
  schedule:
    - cron: '0 0 * * *'  # This triggers automatically every night at 12:00 AM UTC
  workflow_dispatch:      # Allows you to trigger the model training manually whenever you want

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v3

      - name: 2. Initialize Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Tournament Retraining Script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python training_pipeline.py
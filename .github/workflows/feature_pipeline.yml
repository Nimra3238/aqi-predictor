name: Hourly AQI Feature Loop

on:
  schedule:
    - cron: '0 * * * *'  # This cron schedule triggers the job every hour, on the hour
  workflow_dispatch:      # This adds a "Run workflow" button in the GitHub UI for manual testing

jobs:
  update-features:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v3

      - name: 2. Initialize Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Feature Pipeline Script
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python feature_pipeline.py